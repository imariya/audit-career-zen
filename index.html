<script id="audit-data" type="application/json">{"start": "179139575422a40535ec8c", "nodes": {"179139575422a40535ec8c": {"text": "Привет!\nЭто мини-аудит карьерного консультанта Марии Ивакиной 👋\n\nЕсли вы уже не первую неделю в поиске работы, а до офера все еще далеко — дело не всегда в «плохом рынке». Часто это \u003cb>вопрос точечной настройки резюме или пересборки стратегии поиска в целом.\u003c/b> Что требуется в вашем случае - я и предлагаю вам выяснить 👇\n\nВам будет предложено \u003cb>до 5 вопросов с вариантами ответа\u003c/b>, ставьте галочку там, где ответ больше похож на вашу ситуацию. В конце вас будут ждать рекомендации 💚\n\n\u003cb>Начнем?\u003c/b>", "choices": [{"label": "Начнем!", "next": "17913957546526487e45a7"}], "links": []}, "17913957546526487e45a7": {"text": "\u003cb>Какая у вас конверсия в приглашения на собеседования?\u003c/b>\n\u003ci>(Количество собеседований с рекрутером делим на количество откликов)\u003c/i>\n\nЕсли приглашений меньше 10% от числа откликов — скорее всего, проблема в резюме, позиционировании или в том, что вы откликаетесь не туда или не там.", "choices": [{"label": "Менее 10%", "next": "1791395754870a46bda387"}, {"label": "Более или равно 10%", "next": "1791395754cce34ccd1088"}], "links": []}, "1791395754870a46bda387": {"text": "\u003cb>Какие каналы вы используете для поиска?\u003c/b>\n\n1 - Только самые популярные джоб-борды\n2 - И популярные площадки, и нишевые, а также «тёплые» каналы, включая рекомендации и быстрый выход на рекрутеров", "choices": [{"label": "Популярные", "next": "1791395754998f153e0a2b"}, {"label": "Нишевые и теплые", "next": "1791395754217d1f26cd10"}], "links": []}, "1791395754998f153e0a2b": {"text": "\u003cb>Знаете ли вы свою специализацию?\u003c/b>\n\n\u003cb>Да\u003c/b> - Я могу сказать, в каких задачах, компаниях и индустриях я максимально эффективен (на)\n\u003cb>Нет\u003c/b> - Мне сложно сформулировать, в чём моя сила и где моя экспертиза востребована", "choices": [{"label": "Да", "next": "1791395754d268fa081467"}, {"label": "Нет", "next": "1791395754b7413ce7322f"}], "links": []}, "1791395754d268fa081467": {"text": "\u003cb>Понимаете ли вы, какие вакансии вам подходят?\u003c/b>\n\n\u003cb>Да - \u003c/b>Я чётко знаю, как называются подходящие мне позиции и в каких компаниях такие вакансии вообще есть\n\u003cb>Нет\u003c/b> - Я откликаюсь на всё подряд, что более-менее похоже, беру количеством откликов", "choices": [{"label": "Да", "next": "1791395754647c6376d047"}, {"label": "Нет", "next": "17913957540ed0efd7b33b"}], "links": []}, "1791395754647c6376d047": {"text": "Вы понимаете себя и знаете, куда хотите попасть — это уже половина дела. Но поиск сильно завязан на популярных джоб-бордах, а отклики не конвертируются в приглашения.\n\nПохоже, дело в связке: узкий канал + резюме, которое теряется среди сотен таких же откликов на hh. Чтобы сдвинуться, нужно работать сразу с двух сторон — расширять каналы и переработать подачу.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— доработать резюме с фокусом на вашу специализацию и целевые вакансии\n— собрать стратегию поиска с каналами, которые реально работают в вашей нише\n— подготовить самопрезентацию, чтобы управлять впечатлением на собеседовании, а не надеяться на удачу\n\n\u003cb>Если откликается — запишитесь на предварительный звонок:\u003c/b> обсудим вашу ситуацию и наметим план 😌", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзывы клиентов, которые прошли похожий путь:\u003c/b>\n\n\u003cblockquote>спасибо вам большое еще раз! красивое резюме и как проходить собесы это супер, но самое главное наверное что у меня уверенность в своих навыках появилась и я поняла в какие компании можно собеситься и не бояться 🩷🥲\u003c/blockquote>\u003cblockquote>Мария, привет)\nUpd: я нашла работу в старапе)\nСвязка нетворкинг+грамотное резюме работают отлично \nИ работа эта отлично ложится в те ценности, которые мы с тобой обсуждали на встречах! Спасибо большое за консультаци!)\u003c/blockquote>"}, "17913957540ed0efd7b33b": {"text": "Вы понимаете, в чём сильны — и это важная опора. Но поиск ограничен джоб-бордами, вакансии выбираются без разбора, а конверсия низкая.\n\nТакая картина обычно означает: понимание себя есть, а стратегия поиска вокруг него не выстроена. Нужно перевести понимание своей специализации в конкретные инструменты — вакансии, каналы и резюме, которое это понимание отражает.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— доработать резюме с фокусом на вашу специализацию и целевые вакансии\n— собрать стратегию поиска с каналами, которые реально работают в вашей нише\n— подготовить самопрезентацию, чтобы управлять впечатлением на собеседовании, а не надеяться на удачу\n\n\u003cb>Если готовы — запишитесь на предварительный звонок:\u003c/b> обсудим вашу ситуацию и наметим план 😌", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзывы клиентов, которые прошли похожий путь:\u003c/b>\n\n\u003cblockquote>спасибо вам большое еще раз! красивое резюме и как проходить собесы это супер, но самое главное наверное что у меня уверенность в своих навыках появилась и я поняла в какие компании можно собеситься и не бояться 🩷🥲\u003c/blockquote>\u003cblockquote>Мария, привет)\nUpd: я нашла работу в старапе)\nСвязка нетворкинг+грамотное резюме работают отлично \nИ работа эта отлично ложится в те ценности, которые мы с тобой обсуждали на встречах! Спасибо большое за консультаци!)\u003c/blockquote>"}, "1791395754b7413ce7322f": {"text": "\u003cb>Понимаете ли вы, какие вакансии вам подходят?\u003c/b>\n\n\u003cb>Да - \u003c/b>Я чётко знаю, как называются подходящие мне позиции и в каких компаниях такие вакансии вообще есть\n\u003cb>Нет\u003c/b> - Я откликаюсь на всё подряд, что более-менее похоже, беру количеством откликов", "choices": [{"label": "Да", "next": "17913957540d17a250670e"}, {"label": "Нет", "next": "1791395754148bf623036d"}], "links": []}, "17913957540d17a250670e": {"text": "Вы примерно понимаете, какие вакансии и компании вам подходят — но это единственная опора: специализация не сформулирована явно, каналы узкие, конверсия низкая. Понимания «куда» недостаточно без ответа на вопрос «почему именно я» — без него сложно грамотно упаковать себя и выйти за пределы одного канала.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— доработать резюме с фокусом на вашу специализацию и целевые вакансии\n— собрать стратегию поиска с каналами, которые реально работают в вашей нише\n— подготовить самопрезентацию, чтобы управлять впечатлением на собеседовании, а не надеяться на удачу\n\n\u003cb>Если готовы — запишитесь на предварительный звонок:\u003c/b> обсудим вашу ситуацию и наметим план 😌", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзывы клиентов, с которыми прошли схожий путь:\u003c/b>\n\n\u003cblockquote>спасибо вам большое еще раз! красивое резюме и как проходить собесы это супер, но самое главное наверное что у меня уверенность в своих навыках появилась и я поняла в какие компании можно собеситься и не бояться 🩷🥲\u003c/blockquote>\u003cblockquote>Мария, привет)\nUpd: я нашла работу в старапе)\nСвязка нетворкинг+грамотное резюме работают отлично \nИ работа эта отлично ложится в те ценности, которые мы с тобой обсуждали на встречах! Спасибо большое за консультаци!)\u003c/blockquote>"}, "1791395754148bf623036d": {"text": "Здесь проблема не точечная, а системная: непонятны специализация, цель поиска, каналы, а результат откликов не радует.\n\nЭто нормальная ситуация для тех, кто ищет работу впервые за долгое время или меняет направление — но починить это по одному пункту не получится. Нужно заново собрать стратегию поиска целиком: от специализации до конкретных вакансий и каналов.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— доработать резюме с фокусом на вашу специализацию и целевые вакансии\n— собрать стратегию поиска с каналами, которые реально работают в вашей нише\n— подготовить самопрезентацию, чтобы управлять впечатлением на собеседовании, а не надеяться на удачу\n— остаться на связи для точечных вопросов по ходу поиска\n\n\u003cb>Если готовы со мной поработать — запишитесь на предварительный звонок:\u003c/b> обсудим план и познакомимся 😌👇", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзывы клиентов, с которыми прошли похожий путь:\u003c/b>\n\n\u003cblockquote>Мария, добрый вечер!\nПоскольку испытательный срок - это длительная история, напишу отзыв сейчас🌹\nМне очень понравилась наша совместная работа над поиском работы. Очень профессионально помогли сделать резюме, отличные дельные советы на интервью, которые дали пищу для размышлений и более подробное понимание себя и своих желаний. Отличные советы по нехватающим скилам, начала активно использовать ИИ, прокачала навыки экселя и Гугл док. Поняла принцип поиска вакансий и научилась писать классные сопроводительные письма. Крутой опыт. Мне понравилось и было полезно! Да, кстати, сроки поиска работы тоже были оговорены очень четко. Прямо 2 месяца и искала. Спасибо.\u003c/blockquote>\u003cblockquote>Мария!!!! Добрый день \nЯ к Вам с невероятнейшими новостями\nМне сделали оффер!!!!!!! Туда, куда я хотела, могу раскрыть карты...\n...Не знаю какими словами благодарить Вас за всю проделанную работу. Вчера плакала половину вечера от счастья. Безгранично благодарна Вам за проделанную работу и поддержку, а также за то, что помогли мне поверить, что сферу сменить возможно, и это не так смертельно страшно, как я думала\u003c/blockquote>"}, "1791395754217d1f26cd10": {"text": "\u003cb>Знаете ли в 03c/blockquote>\u003cblockquote>Мария, добрый день!\nЯ к вам с первичными итогами)\nВчера вечером начала откликаться на вакансии с новыми резюме\nНа завтра у меня уже стоят три собеседования после аудионтервью. Пока рано делать выводы, но я хочу сказать вам огромное спасибо за работу с моими резюме. Они точно конвертят лучше. Вернулась уверенность. И теперь понимаю, что точно найду проект по душе и с хорошими условиями ❤️‍🩹\u003c/blockquote>"}, "1791395754cce34ccd1088": {"text": "\u003cb>А какая конверсия из звонка с рекрутером в собеседования с командой/руководителем?\u003c/b>\n\n1 - Из 5 собеседований конвертит в следующий этап 1 или 0\n2 - Из 5 собеседований конвертят 2 и более", "choices": [{"label": "1 или 0 /5", "next": "179139575457bf71dab825"}, {"label": "2 и более /5", "next": "1791395754a34934bd1dd7"}], "links": []}, "179139575457bf71dab825": {"text": "\u003cb>Какие каналы вы используете для поиска?\u003c/b>\n\n1 - Только самые популярные джоб-борды\n2 - И популярные, и нишевые площадки, а также «тёплые» каналы, включая быстрый выход на рекрутеров", "choices": [{"label": "Популярные", "next": "1791395754922d879a671b"}, {"label": "Нишевые и теплые", "next": "179139575464ec10ed1f83"}], "links": []}, "1791395754922d879a671b": {"text": "\u003cb>Знаете ли вы свою специализацию?\u003c/b>\n\n\u003cb>Да\u003c/b> - Я могу сказать, в каких задачах, компаниях и индустриях я максимально эффективен (на)\n\u003cb>Нет\u003c/b> - Мне сложно сформулировать, в чём моя сила и где моя экспертиза востребована", "choices": [{"label": "Да", "next": "17913957546732b89ae5f2"}, {"label": "Нет", "next": "17913957545ef876b97e3e"}], "links": []}, "17913957546732b89ae5f2": {"text": "\u003cb>Понимаете ли вы, какие вакансии вам подходят?\u003c/b>\n\n\u003cb>Да - \u003c/b>Я чётко знаю, как называются подходящие мне позиции и в каких компаниях такие вакансии вообще есть\n\u003cb>Нет\u003c/b> - Я откликаюсь на всё подряд, что более-менее похоже, беру количеством откликов", "choices": [{"label": "Да", "next": "17913957549c5ce0f52318"}, {"label": "Нет", "next": "1791395754ce3c8d67c116"}], "links": []}, "17913957549c5ce0f52318": {"text": "Вы хорошо понимаете себя и свои цели, конверсия в интервью в норме — но поиск завязан почти целиком на популярных джоб-бордах. А значит, вы упускаете самые сочные вакансии, которые в открытый доступ вообще не попадают.\nРасширение каналов — самая быстрая точка роста в вашем случае.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы. \n\nЕсли нужен разбор, как выйти на \"закрытый рынок вакансий\", а также эффективно презентовать свои навыки — можем обсудить это в рамках точечных консультаций.\n\n\n\n\u003cb>Если готовы — запишитесь на консультацию 😌\u003c/b> 👇", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Пример из практики:\u003c/b> джун в продуктовом дизайне вышел на стажировку в Яндекс. Открытых вакансий на рынке было — по пальцам одной руки, и та самая нашлась через знакомых. Хотя казалось, что «всех уже спросили». С девушкой мы провели полную подготовку: резюме, собеседования, стратегия поиска. И вот результат:\n\u003cblockquote>Мария, добрый день!\nМеня взяли, завтра выхожу на стажировку 🥳\nСпасибо вам огромное!\u003c/blockquote>"}, "1791395754ce3c8d67c116": {"text": "Вы хорошо понимаете себя, конверсия в норме — но поиск завязан почти целиком на популярных джоб-бордах. Это значит, что вы упускаете самые сочные вакансии, которые не появляются в открытом доступе.\n\nРасширение каналов поиска — самая быстрая точка роста в вашем случае.\n\nКроме этого, важно проверить, а действительно ли вы понимаете свою специализацию, так как выбор подходящих вакансий для отклика - это прямое следствие такого понимания.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы.\n\nЕсли хотите сделать свой поиск более точным и выйти на закрытый рынок вакансий - я буду рада вам подсказать в рамках точечной консультации.\n\nЗапишитесь на предварительный звонок, где познакомимся и обсудим план работы 😌", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Пример из практики:\u003c/b> джун в продуктовом дизайне вышел на стажировку в Яндекс. Открытых вакансий на рынке было — по пальцам одной руки, и та самая нашлась через знакомых. Хотя казалось, что «всех уже спросили». А переработка резюме и самопрезентации позволили произвести нужное впечатление.\n\u003cblockquote>Мария, добрый день!\nМеня взяли, завтра выхожу на стажировку 🥳\nСпасибо вам огромное!\u003c/blockquote>"}, "17913957545ef876b97e3e": {"text": "\u003cb>Понимаете ли вы, какие вакансии вам подходят?\u003c/b>\n\n\u003cb>Да - \u003c/b>Я чётко знаю, как называются подходящие мне позиции и в каких компаниях такие вакансии вообще есть\n\u003cb>Нет\u003c/b> - Я откликаюсь на всё подряд, что более-менее похоже, беру количеством откликов", "choices": [{"label": "Да", "next": "179139575486dd83a72188"}, {"label": "Нет", "next": "17913957542dae50a8f977"}], "links": []}, "179139575486dd83a72188": {"text": "Вы хорошо понимаете себя, конверсия в норме — но поиск завязан почти целиком на популярных джоб-бордах. Это значит, что вы упускаете самые сочные вакансии, которые не появляются в открытом доступе. Расширение каналов поиска — самая быстрая точка роста в вашем случае.\n\nКроме этого, важно убедиться, что вы понимаете свою специализацию = нишу, в которой вы наиболее востребованы. Иначе вы будете попадать в нужные вакансии скорее интуитивно, чем системно.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— глубокий разбор вашего опыта и его упаковку в резюме с фокусом на специализацию и целевые вакансии\n— собрать стратегию поиска с каналами, которые реально работают в вашей нише\n\n\u003cb>Если готовы со мной поработать — запишитесь на предварительный звонок\u003c/b>: обсудим план и познакомимся 😌👇", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзыв клиентки, с которой мы прошли похожий путь:\u003c/b>\n\u003cblockquote>Мария, привет)\nUpd: я нашла работу в старапе)\nСвязка нетворкинг+грамотное резюме работают отлично \nИ работа эта отлично ложится в те ценности, которые мы с тобой обсуждали на встречах! Спасибо большое за консультаци!)\u003c/blockquote>"}, "17913957542dae50a8f977": {"text": "Отклики, которые доходят до цели, конвертируются нормально — но это, похоже, скорее везение, чем система: специализация не сформулирована, вакансии выбираются широко, а каналы ограничены. Стоит начать с главного — понять свою специализацию, и дальше настроить под нее и резюме, и выбор вакансий, и каналы поиска.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы.\n\n\u003cb>Что я предлагаю:\u003c/b>\n— глубокий разбор вашего опыта и его упаковку в резюме с фокусом на специализацию и целевые вакансии\n— подготовку самопрезентации, чтобы управлять впечатлением на собеседовании, а не надеяться на удачу\n\n\u003cb>Если готовы, запишитесь на предварительных звонок:\u003c/b> для знакомства и уточнения плана работы 😌", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "\u003cb>Отзывы клиентов, с которыми мы прошли схожий путь:\u003c/b>\n\u003cblockquote>спасибо вам большое еще раз! красивое резюме и как проходить собесы это супер, но самое главное наверное что у меня уверенность в своих навыках появилась и я поняла в какие компании можно собеситься и не бояться 🩷🥲\u003c/blockquote>\u003cblockquote>Мария, добрый вечер!\nПоскольку испытательный срок - это длительная история, напишу отзыв сейчас🌹\nМне очень понравилась наша совместная работа над поиском работы. Очень профессионально помогли сделать резюме, отличные дельные советы на интервью, которые дали пищу для размышлений и более подробное понимание себя и своих желаний. Отличные советы по нехватающим скилам, начала активно использовать ИИ, прокачала навыки экселя и Гугл док. Поняла принцип поиска вакансий и научилась писать классные сопроводительные письма. Крутой опыт. Мне понравилось и было полезно! Да, кстати, сроки поиска работы тоже были оговорены очень четко. Прямо 2 месяца и искала. Спасибо.\u003c/blockquote>"}, "179139575464ec10ed1f83": {"text": "\u003cb>Знаете ли вы свою специализацию?\u003c/b>\n\n\u003cb>Да\u003c/b> - Я могу сказать, в каких задачах, компаниях и индустриях я максимально эффективен (на)\n\u003cb>Нет\u003c/b> - Мне сложно сформулировать, в чём моя сила и где моя экспертиза востребована", "choices": [{"label": "Да", "next": "1791395754d9b41be20b47"}, {"label": "Нет", "next": "179139575469527839549c"}], "links": []}, "1791395754d9b41be20b47": {"text": "\u003cb>Понимаете ли вы, какие вакансии вам подходят?\u003c/b>\n\n\u003cb>Да - \u003c/b>Я чётко знаю, как называются подходящие мне позиции и в каких компаниях такие вакансии вообще есть\n\u003cb>Нет\u003c/b> - Я откликаюсь на всё подряд, что более-менее похоже, беру количеством откликов", "choices": [{"label": "Да", "next": "1791395754a915dd903622"}, {"label": "Нет", "next": "17913957547d621ec417b1"}], "links": []}, "1791395754a915dd903622": {"text": "У вас крепкая база: конверсия в норме, каналы подходящие, вы знаете, в чем вы сильны и вакансии выбираете осознанно. Если результата пока нет — дело не в стратегии, а в деталях: формулировках, скорости или количестве откликов или самих собеседованиях. Это чинится точечно, без глобальной перестройки.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы.\n\nЕсли вы активно ищете меньше 2 недель, посмотрите статистику конверсий в приглашение по итогам месяца. Если результат будет тот же, приходите на консультацию для точечной настройки.\n\nЕсли сроки активного поиска дольше, можем созвониться и разобрать, что именно надо скорректировать и проведем точечную консультацию 😌 👇", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}]}, "17913957547d621ec417b1": {"text": "С конверсией, каналами и пониманием себя вас все в порядке — а вот с выбором вакансий есть путаница. Вы откликаетесь на всё, что «более-менее похоже», вместо того чтобы целиться в конкретные позиции и компании. Это размывает фокус и отнимает время у откликов, которые реально могли бы выстрелить.\n\nКроме этого, конверсия из скрининга с рекрутером может быть выше. Стоит убедиться, что вы умеете доносить ценность своего опыта на интервью и отвечать на основные вопросы.\n\n\u003cb>Могу предложить точечную консультацию\u003c/b> для настройки такого фокуса и закрытия попутных вопросов.\n\u003cb>Если готовы, запишитесь на предварительных звонок:\u003c/b> для уточнения плана работы и знакомства.", "choices": [], "links": [{"label": "Предварительный звонок", "url": "https://careerzen.ru/#rec872205765"}, {"label": "Об эксперте и отзывы", "url": "https://careerzen.ru/"}], "reviewHtml": "Так, без такой настройки клиентка целилась в вакансии, которые ей не подходили по сфере или уровню и теряла время. Ка <script type="module">
function nextNode(data, id, index) {
  const choice = data.nodes[id]?.choices[index];
  if (!choice || !data.nodes[choice.next]) throw new Error('Unknown answer or transition');
  return choice.next;
}
function remainingQuestions(data, id, visited = new Set()) {
  if (visited.has(id)) throw new Error('Cycle in audit');
  const node = data.nodes[id];
  if (!node) throw new Error('Missing audit step');
  if (!node.choices.length) return 0;
  const path = new Set(visited); path.add(id);
  return 1 + Math.max(...node.choices.map(choice => remainingQuestions(data, choice.next, path)));
}


const card = document.getElementById('card');
const progressPanel = document.getElementById('progress-panel');
const progress = document.getElementById('progress');
let data, current, selected = null, history = [];

function element(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

// Keep the original formatting without executing any source HTML.
function safeFormatting(html) {
  const source = new DOMParser().parseFromString(html, 'text/html');
  const output = document.createDocumentFragment();
  const copy = (node, parent) => {
    if (node.nodeType === Node.TEXT_NODE) { parent.append(document.createTextNode(node.textContent)); return; }
    if (node.nodeType !== Node.ELEMENT_NODE || ['SCRIPT', 'STYLE', 'IFRAME'].includes(node.tagName)) return;
    const target = ['B', 'I', 'BLOCKQUOTE', 'BR'].includes(node.tagName) ? document.createElement(node.tagName.toLowerCase()) : parent;
    if (target !== parent) parent.append(target);
    for (const child of node.childNodes) copy(child, target);
  };
  for (const child of source.body.childNodes) copy(child, output);
  return output;
}

function message(html) {
  const box = element('div', 'message');
  box.style.whiteSpace = 'pre-line';
  box.append(safeFormatting(html)); return box;
}
function plain(html) {
  return new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();
}
function button(text, className, action) {
  const b = element('button', className, text); b.type = 'button';
  b.addEventListener('click', action); return b;
}
function goBack() {
  const last = history.pop();
  if (!last) return;
  current = last.id; selected = last.index; render(true);
}
function updateProgress(isStart, isResult) {
  progressPanel.hidden = isStart;
  const answered = history.filter(item => item.id !== data.start).length;
  progress.max = Math.max(1, answered + remainingQuestions(data, current));
  progress.value = answered;
  document.getElementById('progress-label').textContent = isResult ? 'Аудит завершён' : `Вопрос ${answered + 1}`;
  document.getElementById('progress-count').textContent = isResult ? `${answered} из ${answered}` : 'До 5 вопросов';
}

function render(moveFocus = false) {
  const node = data.nodes[current];
  const isStart = current === data.start;
  const isResult = !node.choices.length;
  card.replaceChildren(); card.setAttribute('aria-busy', 'false');
  updateProgress(isStart, isResult);
  card.append(element('p', 'step-kicker', isStart ? 'Посмотрим на ваш поиск в целом' : isResult ? 'Рекомендации по вашей ситуации' : 'Выберите один ответ'));
  let content = node.text;
  let title = isStart ? 'Начнём с вашей ситуации' : isResult ? 'Ваш результат' : '';
  if (!isStart && !isResult) {
    const match = content.match(/^<b>(.*?)<\/b>\s*/s);
    if (match) { title = plain(match[1]); content = content.slice(match[0].length); }
    else { title = content.split('\n')[0]; content = content.slice(title.length).trim(); }
  }
  const heading = element('h2', 'step-title', title); heading.id = 'step-title'; heading.tabIndex = -1;
  card.append(heading);
  if (content) card.append(message(content));
  if (isStart) {
    const actions = element('div', 'actions');
    actions.append(button(node.choices[0].label, 'primary', () => {
      history.push({ id: current, index: 0 }); current = nextNode(data, current, 0); selected = null; render(true);
    })); card.append(actions);
  } else if (!isResult) {
    const form = element('form');
    const fieldset = element('fieldset', 'choices');
    fieldset.append(element('legend', '', 'Что ближе к вашей ситуации?'));
    const actions = element('div', 'actions');
    const next = element('button', 'primary', node.choices.every(c => !data.nodes[c.next].choices.length) ? 'Показать рекомендации' : 'Продолжить');
    next.type = 'submit'; next.disabled = selected === null;
    node.choices.forEach((choice, i) => {
      const label = element('label', 'choice');
      const input = element('input'); input.type = 'radio'; input.name = 'answer'; input.value = String(i); input.required = true; input.checked = selected === i;
      const choiceLabel = /^\d+$/.test(choice.label) ? `Вариант ${choice.label}` : choice.label;
      label.append(input, element('span', '', choiceLabel));
      input.addEventListener('change', () => { selected = i; next.disabled = false; });
      fieldset.append(label);
    });
    actions.append(button('Назад', 'secondary', goBack), next);
    form.append(fieldset, actions);
    form.addEventListener('submit', event => {
      event.preventDefault(); if (selected === null) return;
      history.push({ id: current, index: selected }); current = nextNode(data, current, selected); selected = null; render(true);
    }); card.append(form);
  } else {
    if (node.callDescription) card.append(message(node.callDescription));
    const links = element('div', 'result-links');
    node.links.forEach((link, i) => {
      if (!/^https:\/\//i.test(link.url)) return;
      const a = element('a', i === 0 ? 'primary' : 'secondary', link.label);
      a.href = link.url; links.append(a);
    }); card.append(links);
    if (node.reviewHtml) {
      const review = element('section', 'review');
      review.append(message(node.reviewHtml));
      card.append(review);
    }
    const details = element('details'); details.append(element('summary', '', 'Ваши ответы'));
    const list = element('dl');
    history.filter(item => item.id !== data.start).forEach(item => {
      const original = data.nodes[item.id];
      list.append(element('dt', '', plain(original.text.split('\n')[0])), element('dd', '', original.choices[item.index].label));
    }); details.append(list); card.append(details);
    const bottom = element('div', 'result-bottom');
    bottom.append(button('Изменить последний ответ', 'text-button', goBack), button('Пройти заново', 'text-button', () => { current = data.start; selected = null; history = []; render(true); }));
    card.append(bottom);
  }
  if (moveFocus) { heading.focus({ preventScroll: true }); card.scrollIntoView({ block: 'start', behavior: 'instant' }); }
}

async function load() {
  card.setAttribute('aria-busy', 'true');
  try {
    data = JSON.parse(document.getElementById('audit-data').textContent); current = data.start; remainingQuestions(data, current); render();
  } catch {
    card.replaceChildren(element('h2', 'step-title', 'Не удалось загрузить вопросы'), element('p', 'error', 'Проверьте подключение к интернету и попробуйте ещё раз.'), button('Попробовать снова', 'secondary', load));
    card.setAttribute('aria-busy', 'false');
  }
}
load();

</script>
